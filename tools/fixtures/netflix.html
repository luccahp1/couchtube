<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture - Netflix</title>
    <!--
      A stand-in for Netflix, built from the markup src/nf.js actually looks for:
      the data-uia control attributes, the title block, the skip button, and
      rows that clip their off-screen pages exactly the way Netflix's sliders do.

      It exists because the real thing is behind a login, and the two bugs most
      likely to bite (focus walking onto a clipped card, and the main-world
      bridge silently not connecting) both reproduce here.
    -->
    <script src="/nfx-stub.js"></script>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #141414; color: #fff; font: 14px/1.4 system-ui, sans-serif; }

      /* ------------------------------------------------------------ browse */
      .lolomoRow { margin: 28px 0; }
      .lolomoRow h2 { margin: 0 0 8px 56px; font-size: 18px; }
      .rowContainer { position: relative; }
      .slider { position: relative; padding: 0 56px; }
      .sliderMask { overflow: hidden; }
      .slider-content { display: flex; gap: 8px; transition: transform 300ms ease; }
      .slider-item { flex: 0 0 18%; }
      .title-card { position: relative; }
      .title-card a {
        display: block; aspect-ratio: 16/9; background: #2b2b2b;
        border-radius: 4px; color: #ddd; text-decoration: none;
        display: flex; align-items: center; justify-content: center; font-size: 13px;
      }
      .handle {
        position: absolute; top: 0; bottom: 0; width: 48px; z-index: 5;
        background: rgba(0,0,0,.6); border: 0; color: #fff; cursor: pointer; font-size: 22px;
      }
      .handlePrev { left: 0; }
      .handleNext { right: 0; }
      .billboard-row { margin: 0 0 12px 56px; display: flex; gap: 12px; }
      .billboard-row a, .billboard-row button {
        padding: 14px 26px; border-radius: 4px; border: 0; font-size: 16px;
        background: #fff; color: #111; text-decoration: none;
      }

      /* ------------------------------------------------------------- watch */
      .watch-video { position: fixed; inset: 0; background: #000; }
      .watch-video--player-view { position: absolute; inset: 0; }
      .watch-video--player-view video { width: 100%; height: 100%; object-fit: contain; }
      .watch-video--back-container { position: absolute; top: 18px; left: 18px; }
      [data-uia='controls-standard'] { position: absolute; inset: auto 0 0 0; }
      .watch-video--bottom-controls-container { padding: 18px 42px; background: linear-gradient(transparent, #000); }
      [data-uia='video-title'] h4 { margin: 0 0 2px; font-size: 22px; }
      [data-uia='video-title'] span { margin-right: 10px; color: #bbb; }
      .btnrow { display: flex; gap: 14px; margin-top: 12px; }
      .btnrow button { padding: 10px 16px; border: 0; border-radius: 4px; background: #333; color: #fff; }
      [data-uia='player-skip-intro'] {
        position: absolute; right: 42px; bottom: 160px; padding: 14px 28px;
        background: #fff; color: #111; border: 0; border-radius: 4px; font-size: 16px;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="browse" class="hidden">
      <div class="billboard-row">
        <a href="/watch/70000001">Play</a>
        <button type="button">More Info</button>
      </div>
      <div id="rows"></div>
    </div>

    <div id="watch" class="watch-video hidden">
      <div class="watch-video--player-view">
        <video id="clip" src="/clip.mp4" preload="auto"></video>

        <div class="watch-video--back-container">
          <button type="button" data-uia="control-back">Back</button>
        </div>

        <button type="button" data-uia="player-skip-intro" class="hidden">Skip Intro</button>

        <div data-uia="controls-standard">
          <div class="watch-video--bottom-controls-container">
            <div data-uia="video-title">
              <h4>Fixture Show</h4>
              <span>S1:E3</span>
              <span>The One With The Selectors</span>
            </div>
            <div class="btnrow">
              <button type="button" data-uia="control-play-pause-pause">Pause</button>
              <button type="button" data-uia="control-next">Next Episode</button>
              <button type="button" data-uia="control-fullscreen-enter">Fullscreen</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const watching = /^\/watch(\/|$)/.test(location.pathname);
      document.getElementById(watching ? 'watch' : 'browse').classList.remove('hidden');
      document.title = watching ? 'Fixture Show - Netflix' : 'Home - Netflix';

      if (!watching) buildRows();

      // Twelve cards per row where only about five fit. The rest stay in the
      // DOM and get clipped by .sliderMask, which is the whole point.
      function buildRows() {
        const wrap = document.getElementById('rows');
        for (let r = 0; r < 4; r++) {
          const row = document.createElement('div');
          row.className = 'lolomoRow';
          row.innerHTML =
            '<h2>Row ' + (r + 1) + '</h2>' +
            '<div class="rowContainer"><div class="slider">' +
            '<button type="button" class="handle handlePrev" aria-label="prev">&#8249;</button>' +
            '<div class="sliderMask"><div class="slider-content"></div></div>' +
            '<button type="button" class="handle handleNext" aria-label="next">&#8250;</button>' +
            '</div></div>';
          const content = row.querySelector('.slider-content');
          for (let i = 0; i < 12; i++) {
            const item = document.createElement('div');
            item.className = 'slider-item slider-item-' + i;
            item.innerHTML =
              '<div class="title-card"><a href="/watch/7000' + r + String(i).padStart(2, '0') + '">R' +
              (r + 1) + ' C' + (i + 1) + '</a></div>';
            content.appendChild(item);
          }
          wrap.appendChild(row);
        }

        // Netflix pages a row by sliding its content. Same here, so the focus
        // code has to cope with cards moving out from under it.
        let page = new WeakMap();
        for (const slider of document.querySelectorAll('.slider')) {
          const content = slider.querySelector('.slider-content');
          page.set(slider, 0);
          slider.querySelector('.handleNext').addEventListener('click', () => {
            const p = Math.min(page.get(slider) + 1, 1);
            page.set(slider, p);
            content.style.transform = 'translateX(-' + p * 100 + '%)';
          });
          slider.querySelector('.handlePrev').addEventListener('click', () => {
            const p = Math.max(page.get(slider) - 1, 0);
            page.set(slider, p);
            content.style.transform = 'translateX(-' + p * 100 + '%)';
          });
        }
      }

      // Test hooks. The suite flips the skip button on to check that r3 skips
      // before it advances, and reads the click log to prove which one fired.
      window.fixture = {
        clicks: [],
        showSkip(on) {
          document.querySelector('[data-uia="player-skip-intro"]').classList.toggle('hidden', !on);
        },
      };
      document.addEventListener(
        'click',
        (ev) => {
          const uia = ev.target.closest('[data-uia]');
          if (uia) window.fixture.clicks.push(uia.getAttribute('data-uia'));
        },
        true
      );
    </script>
  </body>
</html>
